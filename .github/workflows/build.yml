name: Build and graphical smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Config smoke test (not in-game)
        run: |
          mkdir -p test-classes
          javac -d test-classes src/main/java/dev/vortex/client/Modules.java src/main/java/dev/vortex/client/VortexConfig.java tests/ConfigSmokeTest.java
          java -cp test-classes ConfigSmokeTest
      - name: Build remapped client and sources
        run: gradle --no-daemon build
      - name: Install virtual display and software rendering
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Render title notice and dashboard (no world joined)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          mkdir -p run
          printf 'onboardAccessibility:false\n' > run/options.txt
          set -o pipefail
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' gradle --no-daemon runClient -PvortexCiSmoke 2>&1 | tee gui-smoke.log
          grep -q 'VORTEX_CI_GUI_SMOKE_PASS' gui-smoke.log
      - name: Surface client diagnostics in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in (Path('gui-smoke.log'), Path('run/logs/latest.log')):
              if path.exists():
                  tail = path.read_text(errors='replace')[-10000:]
                  escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title={path}::{escaped}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-build-and-test-logs
          path: |
            build/libs/*.jar
            build/reports/
            gui-smoke.log
            run/logs/
            run/crash-reports/
          if-no-files-found: warn
